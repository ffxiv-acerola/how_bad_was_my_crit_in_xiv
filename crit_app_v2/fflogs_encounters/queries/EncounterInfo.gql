query EncounterInfo($code: String!, $id: [Int!]) {
    reportData {
        report(code: $code) {
            startTime
            fights(fightIDs: $id, translate: true) {
                name
                encounterID
                kill
                startTime
                endTime
                combatTime
                lastPhase
                friendlyPets {
                    id
                    petOwner
                }
                enemyNPCs {
                    gameID
                    id
                }
            }
            playerDetails(fightIDs: $id, includeCombatantInfo: false)
        }
    }
}
